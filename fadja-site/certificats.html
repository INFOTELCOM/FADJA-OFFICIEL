<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FADJA — Espace certificats</title><meta name="theme-color" content="#0A1A4F">
<style>
:root{--navy:#0A1A4F;--blue:#1E4FD8;--sun:#FFC72C;--bg:#f5f7fc;--ink:#101a38;--mut:#64708f;--line:#dfe5f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--blue)}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.brand img{height:48px;border-radius:8px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 50px #0a1a4f0c;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.mut{color:var(--mut)}.err{color:#b42318;min-height:24px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#e9efff;color:var(--blue);font-weight:700;font-size:12px}.cert{border:2px solid var(--line);border-radius:18px;padding:28px;background:linear-gradient(135deg,#fff,#f8faff)}.cert h1{margin:6px 0 0;font-size:30px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.qr{width:150px;height:150px;border:10px solid #fff;box-shadow:0 8px 24px #0001}.hide{display:none!important}footer{color:var(--mut);font-size:12px;padding:20px 0;text-align:center}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><img src="assets/logo.jpg" onerror="this.style.display='none'" alt="FADJA"><div><b>FADJA</b><div class="mut">Espace certificats</div></div></div><a href="index.html">Retour au site</a></header>
<main id="app"></main><footer>Les certificats privés sont accessibles uniquement après authentification. La vérification publique ne révèle que les informations nécessaires à l'authenticité du document.</footer>
</div>
<script src="config.js"></script><script>
const C=window.SBC||{};const app=document.getElementById('app');const LS=localStorage;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>{try{return JSON.parse(LS.getItem('fadja_tok')||'null')?.access_token||''}catch(e){return''}};
const api=async(path,opt={})=>{const h={apikey:C.key,'Content-Type':'application/json',...(token()?{Authorization:'Bearer '+token()}:{}),...(opt.headers||{})};const r=await fetch(C.url+path,{...opt,headers:h});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||j?.msg||'Erreur '+r.status);return j};
async function auth(p,b){const r=await fetch(C.url+'/auth/v1/'+p,{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
function saveTok(j){LS.setItem('fadja_tok',JSON.stringify(j))}
function getCode(){return new URLSearchParams(location.search).get('code')||''}
function qrUrl(code){return 'https://quickchart.io/qr?size=220&margin=1&text='+encodeURIComponent(location.origin+location.pathname+'?verify='+encodeURIComponent(code))}
function verifyCode(){return new URLSearchParams(location.search).get('verify')||''}
async function verify(){const code=verifyCode();if(!code)return false;app.innerHTML='<div class="card"><h2>Vérification du certificat</h2><p class="mut">Vérification en cours…</p></div>';try{const r=await api('/rest/v1/rpc/verify_certificate',{method:'POST',body:JSON.stringify({p_code:code})});if(!r.length){app.innerHTML='<div class="card"><h2>Certificat introuvable</h2><p class="mut">Le code scanné ne correspond à aucun certificat enregistré.</p></div>';return true}const x=r[0];app.innerHTML='<div class="card"><span class="badge">'+(x.status==='revoked'?'CERTIFICAT RÉVOQUÉ':'CERTIFICAT AUTHENTIFIÉ')+'</span><h2>'+esc(x.participant_name)+'</h2><p><b>Formation :</b> '+esc(x.training_title)+'</p><p><b>N° :</b> '+esc(x.certificate_number)+'</p><p><b>Délivré le :</b> '+new Date(x.issued_at).toLocaleDateString('fr-FR')+'</p><p class="mut">Cette page permet de vérifier l’authenticité du certificat. Le fichier du certificat et les données privées ne sont pas exposés.</p></div>';return true}catch(e){app.innerHTML='<div class="card"><h2>Vérification impossible</h2><p class="err">'+esc(e.message)+'</p></div>';return true}}
async function claim(){const raw=LS.getItem('fadja_cert_invite');if(!raw||!token())return null;try{return await api('/rest/v1/rpc/claim_certificate_invite',{method:'POST',body:JSON.stringify({p_token:raw})})}catch(e){return null}}
async function myCertificates(){const rows=await api('/rest/v1/certificates?select=id,certificate_number,participant_name,training_title,issued_at,status,pdf_path&order=issued_at.desc');return rows}
async function signUp(){const n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim(),p=document.getElementById('p').value;if(!n||!e||p.length<8){document.getElementById('err').textContent='Nom, e-mail et mot de passe (8 caractères minimum) sont requis.';return}const j=await auth('signup',{email:e,password:p,options:{data:{name:n,role:'Participant'}}});if(j.access_token){saveTok(j);await claim();render()}else{document.getElementById('err').textContent='Compte créé. Vérifiez votre e-mail, puis revenez ici pour vous connecter.'}}
async function signIn(){const e=document.getElementById('e').value.trim(),p=document.getElementById('p').value,j=await auth('token?grant_type=password',{email:e,password:p});if(!j.access_token){document.getElementById('err').textContent='E-mail ou mot de passe incorrect.';return}saveTok(j);await claim();render()}
function loginView(sign=true){app.innerHTML='<div class="card"><h1>'+ (sign?'Créer votre espace':'Connexion à votre espace')+'</h1><p class="mut">'+(sign?'Le lien FADJA vous donne accès à votre certificat après création du compte.':'Connectez-vous pour consulter et télécharger vos certificats.')+'</p>'+(sign?'<label>Nom complet</label><input id="n" autocomplete="name">':'')+'<label>E-mail</label><input id="e" type="email" autocomplete="email"><label>Mot de passe</label><input id="p" type="password" autocomplete="'+(sign?'new-password':'current-password')+'"><div id="err" class="err"></div><div class="actions"><button class="btn" onclick="'+(sign?'signUp()':'signIn()')+'">'+(sign?'Créer mon compte':'Se connecter')+'</button><button class="btn alt" onclick="loginView('+(sign?'false':'true')+')">'+(sign?'J’ai déjà un compte':'Créer un compte')+'</button></div></div>'}
async function render(){if(verifyCode()){await verify();return}const t=token();if(!t){if(getCode())LS.setItem('fadja_cert_invite',getCode());loginView(true);return}try{await claim();const rows=await myCertificates();app.innerHTML='<div class="card"><span class="badge">ESPACE PERSONNEL</span><h1>Mes certificats</h1><p class="mut">Vos certificats sont liés à votre compte authentifié.</p></div>'+(rows.length?rows.map(x=>'<div class="cert"><span class="badge">'+esc(x.status)+'</span><h2>'+esc(x.training_title)+'</h2><p><b>'+esc(x.participant_name)+'</b><br>N° '+esc(x.certificate_number)+' · '+new Date(x.issued_at).toLocaleDateString('fr-FR')+'</p><div class="actions">'+(x.pdf_path?'<button class="btn" onclick="downloadCert(\''+encodeURIComponent(x.pdf_path)+'\')">Télécharger le certificat</button>':'<span class="mut">Le fichier du certificat sera disponible après validation par FADJA.</span>')+'</div></div>').join(''):'<div class="card"><h2>Aucun certificat</h2><p class="mut">Votre compte est bien créé, mais aucun certificat ne vous a encore été attribué.</p></div>')+'<div class="actions"><button class="btn alt" onclick="logout()">Se déconnecter</button></div>'}catch(e){LS.removeItem('fadja_tok');loginView(false)}}
async function downloadCert(path){try{const p=decodeURIComponent(path);const r=await fetch(C.url+'/storage/v1/object/sign/certificates/'+p,{method:'POST',headers:{apikey:C.key,Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:900})});const j=await r.json();if(!r.ok)throw new Error(j.message||'Téléchargement refusé');const u=j.signedURL.startsWith('http')?j.signedURL:C.url+'/storage/v1'+j.signedURL;location.href=u}catch(e){alert('Téléchargement impossible : '+e.message)}}
function logout(){LS.removeItem('fadja_tok');render()}
render();
</script></body></html>
